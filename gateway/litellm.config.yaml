# LiteLLM gateway config — maps friendly names to provider/model targets.
# Keys are pulled from the environment (see ../.env.example). Trim to the
# providers you actually have. Docs: https://docs.litellm.ai/docs/proxy/configs
#
# Model IDs move FAST — providers add and retire models constantly. The IDs
# below were current on 2026-07-18. Before relying on them, confirm against
# each provider's model list (../docs/links.md) or hit /v1/models. If a call
# 404s on the model, that's the first thing to check.

model_list:
  # Anthropic — Claude. Sonnet 5 is the current price/performance default
  # below Opus. (Opus: anthropic/claude-opus-4-8 · Haiku: anthropic/claude-haiku-4-5)
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Groq — fast, cheap open-weight inference. Groq deprecated the Llama chat
  # models in mid-2026; gpt-oss is the current fast pick. The "openai/" here is
  # part of Groq's model id, not a call to OpenAI. (Bigger: groq/openai/gpt-oss-120b)
  - model_name: fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  # OpenAI — GPT. gpt-5.6 aliases to the current flagship (Sol). Cheaper/faster
  # tiers exist in the same family; swap the id to taste.
  - model_name: gpt
    litellm_params:
      model: openai/gpt-5.6
      api_key: os.environ/OPENAI_API_KEY

# Optional: route to a fallback if a provider is down.
# litellm_settings:
#   fallbacks: [{"claude": ["gpt"]}]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
